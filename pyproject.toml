[project]
name = "django-vite-sample"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "luciano ratamero", email = "luciano@ratamero.com" }
]
requires-python = ">=3.13"
dependencies = [
    "django>=6.1.3",
    "django-cors-headers>=4.9.0",
    "django-vite>=3.2.0",
    "djangorestframework>=3.18.3",
]

[project.scripts]
django-vite-sample = "django_vite_sample:main"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.17.6",
]

[tool.ruff]
line-length = 100 # same as the frontend's Prettier printWidth
extend-exclude = ["**/migrations"] # generated by Django

[tool.ruff.lint]
# Django's Meta options (ordering, fields, widgets) are mutable class attributes by design.
ignore = ["RUF012"]
